[package]
name        = "dpp-domain"
description = "EU Digital Product Passport domain types, port traits, and per-field disclosure policy"
keywords    = ["dpp", "espr", "eu-regulation", "ecodesign", "sustainability"]
categories  = ["data-structures"]
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
rust-version.workspace = true

[dependencies]
dpp-rules   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_with  = { workspace = true }
# v7+serde+js: v7 generates time-sortable UUIDs (B-tree friendly); js enables
# getrandom's JS backend so crypto.getRandomValues is used on wasm32-unknown-unknown.
uuid        = { version = "1", features = ["v7", "serde", "js"] }
chrono      = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }

semver      = "1"

# Excluded from `wasm32-unknown-unknown`. The reason recorded here was that
# jsonschema pulls blocking reqwest — which was true, and is no longer: the
# workspace dependency now disables `resolve-http` (see the root manifest).
# The exclusion stays because nothing has *built* it for wasm32 since, and a gate
# kept for a reason that has expired is worth either testing or removing rather
# than inheriting. Lifting it would let the wasm32 consumers validate against the
# embedded schemas, which today they cannot.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonschema  = { workspace = true }

[features]
test-utils = ["sha2", "hex"]

[dependencies.sha2]
workspace = true
optional  = true

[dependencies.hex]
workspace = true
optional  = true

[dev-dependencies]
serde_json = { workspace = true }
tokio      = { version = "1", features = ["macros", "rt"] }
sha2       = { workspace = true }
hex        = { workspace = true }
proptest   = { workspace = true }
