[package]
name        = "dpp-tests"
description = "Cross-crate integration tests for Odal Node core (not published)"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish = false

[lib]
name = "dpp_tests"
path = "src/lib.rs"

# The library hosts shared test fixtures (see `src/fixtures.rs`) consumed by
# the integration tests below, so its own core-crate dependencies are real
# (not dev-only) dependencies.
[dependencies]
dpp-domain = { workspace = true }
dpp-crypto = { workspace = true }
dpp-vc     = { workspace = true }
chrono     = { workspace = true }

# Integration tests in `tests/` exercise multiple core crates together
# (domain + crypto + gs1), so they live in a dedicated member crate rather
# than the virtual workspace root (where Cargo never compiled them).
[dev-dependencies]
dpp-digital-link    = { workspace = true }
dpp-aas             = { workspace = true }
dpp-vocab           = { workspace = true }
dpp-registry        = { workspace = true }
# Read so a test can hold the shared battery-category vocabulary against the
# domain enum and the JSON schema. Dev-only: nothing in `src/` uses it, and
# this crate is `publish = false`, so the edge does not reach the crate graph
# anyone vendors. `bundle` is on so `jws_crit_rejection` can drive the real
# `verify_bundle`; `dpp-calc` already enables it across the workspace, but a
# `-p dpp-tests` build must not depend on that.
dpp-rules           = { workspace = true, features = ["bundle"] }
serde_json = { workspace = true }
# `jws_crit_rejection` signs a header `dpp-crypto` will not write, which needs
# the signing primitive itself. Already in the workspace graph.
ed25519-dalek = { workspace = true }
# `carrier_resolution` drives the repository port, whose lookups are async.
async-trait = { workspace = true }
tokio      = { version = "1", features = ["macros", "rt"] }
uuid       = { workspace = true }
semver     = { workspace = true }
base64     = { workspace = true }
jsonschema = { workspace = true }
# `jades_annex_b_schemas` and `json_schema_draft07` check the vendored ETSI
# schema files and the vendored suite files against the SHA-256s recorded in
# their NOTICE.md. Both are already in the workspace graph.
sha2       = { workspace = true }
hex        = { workspace = true }
