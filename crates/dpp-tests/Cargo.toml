[package]
name        = "dpp-tests"
description = "Cross-crate integration tests for Odal Node core (not published)"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true
publish = false

# `plugins/` and `fuzz/` are separate workspaces, so cargo-release never sees
# them. This crate carries the two steps that keep them in lockstep
# (`plugin_version_lockstep.rs`, `just lock-check`): move the plugins' version, then
# re-resolve every lockfile against it. It is one crate so each runs once.
# The hook first refuses a checkout that is not origin's main
# (`scripts/release-head-check.sh`), before anything is published.
[package.metadata.release]
pre-release-replacements = [
    { file = "../../plugins/Cargo.toml", search = '(?m)^version = "[^"]*"', replace = 'version = "{{version}}"', exactly = 1 },
]
pre-release-hook = ["just", "pre-release"]

[lib]
name = "dpp_tests"
path = "src/lib.rs"

# The command line the W3C VC-JOSE-COSE test suite runs against `dpp-vc`. The suite
# workflow builds it on the runner and `.github/oracle/vc-jose-cose/compose.yml` runs
# it in a container; it calls only the public API of `dpp-vc` and `dpp-crypto`. Its
# checker, its manifest of enabled features and its README are in
# `.github/oracle/vc-jose-cose/`.
[[bin]]
name = "vc-jose-cose-suite"
path = "src/bin/vc_jose_cose_suite/main.rs"

# The library hosts shared test fixtures (see `src/fixtures/`) consumed by
# the integration tests below, so its own core-crate dependencies are real
# (not dev-only) dependencies.
[dependencies]
dpp-domain = { workspace = true }
dpp-crypto = { workspace = true }
dpp-vc     = { workspace = true }
chrono     = { workspace = true }
# The fixtures that build a passport's wire form (`schema_compat_fixture`, `passport_with`).
serde_json = { workspace = true }
# The `vc-jose-cose-suite` binary reads and writes a COSE message as base64 text, and a
# binary is not built with dev-dependencies.
base64     = { workspace = true }

# Integration tests in `tests/` exercise multiple core crates together
# (domain + crypto + gs1), so they live in a dedicated member crate rather
# than the virtual workspace root (where Cargo never compiled them).
[dev-dependencies]
dpp-digital-link    = { workspace = true }
dpp-aas             = { workspace = true }
dpp-vocab           = { workspace = true }
dpp-registry        = { workspace = true }
# Read so a test can hold the shared battery-category vocabulary against the
# domain enum and the JSON schema. Dev-only: nothing in `src/` uses it, and
# this crate is `publish = false`, so the edge does not reach the crate graph
# anyone vendors. `bundle` is on so `jws_crit_rejection` can drive the real
# `verify_bundle`; `dpp-calc` already enables it across the workspace, but a
# `-p dpp-tests` build must not depend on that.
dpp-rules           = { workspace = true, features = ["bundle"] }
# `carrier_resolution` drives the repository port, whose lookups are async.
async-trait = { workspace = true }
tokio      = { version = "1.40", features = ["macros", "rt"] }
uuid       = { workspace = true }
semver     = { workspace = true }
jsonschema = { workspace = true }
# `jades_annex_b_schemas` and `json_schema_draft07` check the vendored ETSI
# schema files and the vendored suite files against the SHA-256s recorded in
# their NOTICE.md. Both are already in the workspace graph.
sha2       = { workspace = true }
hex        = { workspace = true }

[lints]
workspace = true
