[package]
name        = "dpp-calc"
description = "EU-methodology compliance calculators (CO2e, repairability) for Odal Node — pure, stateless"
keywords    = ["dpp", "co2e", "pef", "repairability", "espr"]
categories  = ["science", "mathematics"]
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
rust-version.workspace = true

[lib]
name = "dpp_calc"
path = "src/lib.rs"

[features]
# Expose SyntheticFactorProvider outside of test builds.
# Enable only in integration test harnesses — never in production binaries.
synthetic-factors = []

# Gate licensed LCI factor-data implementations (ecoinvent, EF, Sphera).
# This feature is DISABLED in the open-source build and MUST NOT be enabled
# unless a valid reseller/embedding sublicense for the factor data is in place.
# The platform build system enables it when deploying the managed service.
real-factors = []

[dependencies]
# The Art. 8 minimum shares and phase dates are legal thresholds, and they
# already have a home. Depending on that home rather than restating the numbers
# is what keeps a threshold from being amended in one crate and not the other.
# `bundle` is on because this crate is the format's first real consumer: the
# signed-ruleset channel verified payloads that nothing read, so its fail-closed
# path had never been exercised from a caller whose behaviour depended on it.
dpp-rules  = { workspace = true, features = ["bundle"] }

serde      = { workspace = true }
serde_json = { workspace = true }
serde_jcs  = { workspace = true }
chrono     = { workspace = true }
uuid       = { workspace = true }
sha2       = { workspace = true }
hex        = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
# Test-only: the bundle-fill tests assemble a JWS-shaped manifest so they can
# drive the real `verify_bundle` rather than a stand-in for it. Signing stays
# engine-side, so only the base64 encoding is needed here.
base64 = { workspace = true }
