[package]
name        = "dpp-crypto"
description = "Key management in which every key carries its signature algorithm (Ed25519, and ECDSA on P-256, P-384 and P-521 as ES256, ES384 and ES512), JWS signing/verification, JAdES baseline construction, and an encrypted keystore"
keywords    = ["dpp", "ed25519", "jws", "keystore", "cryptography"]
categories  = ["cryptography", "authentication"]
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
rust-version.workspace = true

[lib]
name = "dpp_crypto"
path = "src/lib.rs"

[dependencies]
thiserror  = { workspace = true }
ed25519-dalek    = { workspace = true }
p256             = { workspace = true }
p384             = { workspace = true }
p521             = { workspace = true }
zeroize          = { workspace = true }
aes-gcm          = { workspace = true }
rand             = { workspace = true }
base64           = { workspace = true }
hex              = { workspace = true }
sha2             = { workspace = true }
argon2           = { workspace = true }
hmac             = { workspace = true }
chrono           = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
serde_jcs        = { workspace = true }
cbor4ii          = { workspace = true }
anyhow           = { workspace = true }
tracing          = { workspace = true }
uuid             = { workspace = true }

[dev-dependencies]
uuid          = { version = "1.14", features = ["v4"] }
tracing-test  = "0.2.5"
proptest      = { workspace = true }
# G-4 (release review): independent Ed25519 implementation (separate codebase
# from ed25519-dalek) used only to cross-verify a golden JWS vector in tests —
# never used in production signing/verification code.
ring          = "0.17.12"
rcgen = { version = "0.14.9", default-features = false, features = ["ring", "pem"] }
x509-parser = "0.18.1"

[lints]
workspace = true
