[package]
name        = "dpp-vc"
description = "W3C Verifiable Credentials, did:web documents and status lists for Odal Node"
keywords    = ["credentials", "did", "did-web", "json-ld", "status-list"]
categories  = ["cryptography", "encoding"]
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
rust-version.workspace = true

[lib]
name = "dpp_vc"
path = "src/lib.rs"

[dependencies]
dpp-domain = { workspace = true }
# The JSON-LD `@context` names GS1's vocabulary, and where that prefix IRI comes
# from — and whether anyone has read it — is a claim with one home.
dpp-vocab  = { workspace = true }
dpp-crypto = { workspace = true }
async-trait = { workspace = true }
base64      = { workspace = true }
chrono      = { workspace = true }
flate2      = { workspace = true }
anyhow      = { workspace = true }
hex         = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_jcs   = { workspace = true }
sha2        = { workspace = true }
uuid        = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
uuid  = { version = "1", features = ["v4"] }
