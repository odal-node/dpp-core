[workspace]
resolver = "2"
members = [
    "crates/dpp-rules",
    "crates/dpp-domain",
    "crates/dpp-crypto",
    "crates/dpp-digital-link",
    "crates/dpp-aas",
    "crates/dpp-vc",
    "crates/dpp-plugin-traits",
    "crates/dpp-plugin-sdk",
    "crates/dpp-registry",
    "crates/dpp-calc",
    "crates/dpp-vocab",
    "crates/dpp-tests",
    "benches",
]
exclude = [
    "plugins/*",
]

[workspace.package]
version     = "0.24.0"
edition     = "2024"
authors     = ["Odal Node <dev@odal-node.io>"]
license     = "Apache-2.0"
repository  = "https://github.com/odal-node/dpp-core"
homepage    = "https://odal-node.io"
rust-version = "1.99"

# ---------------------------------------------------------------------------
# Debug-build profile
#
# `line-tables-only` keeps what this workspace debugs with, function names and
# file and line numbers in backtraces and panic messages, and drops the
# variable-level DWARF that makes up most of a debug build's size and of the
# memory its links need. The cost is variable inspection under a step debugger.
# `test` inherits from `dev`, so this covers the test binaries too.
#
# Only this workspace's own builds read it: a crate depending on these from
# crates.io builds them under its own profile.
# ---------------------------------------------------------------------------
[profile.dev]
debug = "line-tables-only"

# ---------------------------------------------------------------------------
# cargo-release: all members share one lockstep version, so cut one tag for
# the whole release instead of cargo-release's default per-crate tag scheme
# (crate-name-v0.4.1 for every publishable member).
# ---------------------------------------------------------------------------
[workspace.metadata.release]
consolidate-commits = true
tag-name    = "v{{version}}"
tag-prefix  = ""
tag-message = "Release version {{version}}"
# A crates.io publish cannot be undone, and cargo-release's default allows any
# branch. Every step refuses another branch by name, `publish` and `tag`
# included; `scripts/release-head-check.sh` refuses a main that is not origin's.
allow-branch = ["main"]

# ---------------------------------------------------------------------------
# Lints every member takes with `[lints] workspace = true`. `just lint` and CI
# run clippy with `-D warnings`, so a warning here fails the build.
#
# A library writes nothing to its caller's stdout or stderr: whatever it has to
# say is a return value, and output the caller did not ask for lands in their
# logs, their CLI's output or a wasm host that has no console. `dbg!` is a
# debugging aid that was never meant to ship. Tests may print
# (`allow-print-in-tests` in `.clippy.toml`), and so may an example, which says
# so at its top: printing is what it is for.
# ---------------------------------------------------------------------------
[workspace.lints.clippy]
print_stdout = "warn"
print_stderr = "warn"
dbg_macro    = "warn"

# ---------------------------------------------------------------------------
# Shared dependency versions — crates inherit these with `workspace = true`
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Internal workspace crates — path for local builds (always wins inside this
# workspace), version for what `cargo publish` embeds for external consumers.
# One line per crate here instead of one per dependent Cargo.toml, so a
# lockstep version bump is a single edit, not N.
dpp-rules         = { path = "crates/dpp-rules", version = "0.24.0" }
dpp-domain        = { path = "crates/dpp-domain", version = "0.24.0" }
dpp-plugin-traits = { path = "crates/dpp-plugin-traits", version = "0.24.0" }
dpp-crypto        = { path = "crates/dpp-crypto", version = "0.24.0" }
dpp-digital-link  = { path = "crates/dpp-digital-link", version = "0.24.0" }
dpp-aas           = { path = "crates/dpp-aas", version = "0.24.0" }
dpp-vc            = { path = "crates/dpp-vc", version = "0.24.0" }
dpp-vocab         = { path = "crates/dpp-vocab", version = "0.24.0" }
dpp-calc          = { path = "crates/dpp-calc", version = "0.24.0" }
dpp-registry      = { path = "crates/dpp-registry", version = "0.24.0" }
dpp-tests         = { path = "crates/dpp-tests", version = "0.24.0" }

# Serialisation
serde        = { version = "1.0.229", features = ["derive"] }
serde_json   = "1.0.145"
serde_with   = "3.0"
# RFC 8785 JSON Canonicalization Scheme (JCS) — the signing/content-binding contract
serde_jcs    = "0.4.0"
# GZIP — decoding W3C Bitstring Status List `encodedList` (pure, no infra)
flate2       = "1.0.34"

# CBOR (RFC 8949): the codec under `dpp-crypto`'s COSE_Sign1. A codec only:
# `COSE_Sign1` and its header rules are written in `dpp-crypto`. Default features
# are off, which leaves no dependency of its own (`half` and `serde` are optional).
cbor4ii      = { version = "1.2.5", default-features = false }

# Date/time
chrono       = { version = "0.4.38", features = ["serde"] }

# Async
async-trait  = "0.1.88"

# Identity & cryptography
base64       = "0.23"
hex          = "0.4.3"
sha2         = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
p256         = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p384         = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p521         = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
zeroize      = { version = "1.9.0", features = ["derive"] }
aes-gcm      = "0.11.0"
rand         = "0.10.0"

# Schema validation.
#
# 🚨 `default-features = false` is load-bearing, not tidying. The default set is
# `resolve-http`, `resolve-file`, `tls-aws-lc-rs` and `idna`, and the first three
# put reqwest, hyper, tokio, rustls and aws-lc-sys into `dpp-domain` — the crate
# whose whole claim is that it has no network and no async runtime. It is not
# only a dependency-graph problem: with `resolve-http` on, a schema carrying a
# remote `$ref` makes `VersionedSchemaRegistry::register` **open a TCP
# connection**, and again on every lazy compile after it.
#
# Every `$ref` in the schemas this crate embeds is a local fragment, so nothing
# here needs either resolver. Without them a remote `$ref` fails closed instead
# of reaching the network, which is the behaviour a pure validation crate should
# have.
#
# `idna` is kept, and it is the one default worth keeping. It gates the
# `idn-hostname` and `idn-email` format validators (every `#[cfg(feature =
# "idna")]` in the crate is in `keywords/format.rs`); it is pure, and it touches
# no resolution path. The schemas embedded here use neither format — but
# `VersionedSchemaRegistry::register` compiles schemas supplied at runtime, and
# dropping the feature would silently downgrade both formats to "unknown" for
# those rather than fail, which is a validator quietly accepting what it was
# asked to reject.
jsonschema   = { version = "0.63.0", default-features = false, features = ["idna"] }
semver       = "1.0"

# Property-based testing (dev-only)
proptest     = "1.0"

# Telemetry
tracing      = "0.1.40"

# Utilities
uuid         = { version = "1.14", features = ["v7", "serde"] }
anyhow       = "1.0.104"
thiserror    = "2.0"
ref-cast     = "1.0.25"

# KDF
argon2       = "0.6.0"

# MAC
hmac         = "0.13.0"

# Benchmarking
criterion    = { version = "0.8", features = ["html_reports"] }
