# cargo-deny — dependency policy for a published, Apache-2.0 library.
#
# `cargo audit` already ran here and answers one question: is a dependency
# subject to a RUSTSEC advisory. It cannot answer the three that matter most for
# a crate someone else vendors:
#
#   - **licences**: what is a downstream consumer obliged to do by depending on
#     us. This repo is Apache-2.0 and published to crates.io, so a copyleft
#     dependency arriving transitively is a licensing fact about every consumer,
#     not a note for us. Nothing checked this before.
#   - **bans**: is the same library linked twice at incompatible versions, and
#     is anything here that should not be.
#   - **sources**: did a dependency come from somewhere other than crates.io.
#
# The consumer this exists for is the one who vendors this crate and has to
# answer a licence question about their whole graph.

[graph]
# Check the dependency graph for every target rather than only the host's.
# A dependency that is Linux-only still ships in the published crate, and a
# licence obligation does not stop applying because the checker ran on one OS.
all-features = true

[advisories]
# `cargo audit` covers this too; keeping it here means one tool can answer the
# whole question in the scheduled run, and the two agreeing is itself a signal.
version = 2
yanked = "deny"
ignore = [
    # Each entry must carry the advisory id, the reason it does not reach this
    # workspace, and what would make it reach us. An unexplained ignore is a
    # suppression nobody can re-audit.
]

[licenses]
version = 2
# Permissive only. This is not a preference: an Apache-2.0 crate that pulls a
# reciprocal or copyleft dependency into a consumer's graph changes that
# consumer's obligations without telling them.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    # Data, not code: the Mozilla CA root store, reaching us as
    # `webpki-root-certs` via `jsonschema -> reqwest -> rustls-platform-verifier`.
    # CDLA-Permissive-2.0 imposes no reciprocity and no downstream obligation —
    # it is the standard licence for that dataset. Allowed on that basis, not
    # because it happened to be in the graph: this was the one licence the
    # permissive-only list above rejected on first run, which is the check
    # earning its place.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Workspace members are not published under someone else's terms, and several
# are `publish = false`. Ignoring them keeps the report about the dependency
# graph rather than about ourselves.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A wildcard dependency in a *published* crate is the sharper case: it resolves
# to whatever exists at vendor time, so two consumers of the same released
# version can get different graphs.
allow-wildcard-paths = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies. A published crate cannot have one — `cargo publish`
# refuses — so this is a gate that says so before the release does.
allow-git = []
