# The command-line harness the W3C VC-JOSE-COSE test suite runs. Standalone, with its
# own `[workspace]` and lockfile, like `fuzz/`: `cargo build --workspace` at the
# repository root does not build it and needs nothing it needs. It takes `dpp-vc`
# and `dpp-crypto` by path and calls only their public API.
[package]
name = "vc-jose-cose-suite"
version = "0.0.0"
description = "The command line the W3C VC-JOSE-COSE test suite calls, over dpp-vc"
publish = false
edition = "2024"
rust-version = "1.99"

[dependencies]
dpp-crypto = { path = "../../crates/dpp-crypto" }
dpp-vc = { path = "../../crates/dpp-vc" }
serde_json = "1"

[workspace]
