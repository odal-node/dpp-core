# Odal Node — Clippy configuration
# All warnings are treated as errors in CI (via -D warnings flag).

# Disallow integer arithmetic that can silently overflow.
arithmetic-side-effects-allowed = []

# Disallow std::mem::forget — use drop() or ManuallyDrop.
# (prevents accidental key material leaks in identity service)

# A test may print what it found or wrote; `print_stdout` and `print_stderr`
# (the workspace lints in Cargo.toml) hold for everything else.
allow-print-in-tests = true
