name: Standards status

# Weekly: do the IETF rows of the standards register still say what the RFC
# Editor's index says?
#
# `standard_citations.rs` proves every cited RFC has a row and that the row has a
# status somebody dated. It cannot prove the status is still true, and the
# release-time re-read is the only other check. A specification can be updated or
# obsoleted in between with nothing here changing, so a row that has gone stale
# reads exactly like one that has not. The first manual read found a deprecation
# that nothing in CI would have reported.
#
# Report only. It fails the run to say a row differs and never edits the register:
# the `Read` date records a person reading a source, and a job that moved it would
# turn "somebody checked" into "a job ran". W3C, GS1, IDTA and ETSI rows are not
# compared, since no equally plain feed exists for them.
#
# Deliberately not a pull-request check: it asks someone else's server, and a
# gate that fails because that server is down is a gate people stop trusting.
on:
  schedule:
    # Mondays, after the newest-dependencies run, so the week's findings arrive
    # together.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: IETF rows match the RFC Editor's index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The comparison is shown to find a difference before it is trusted to say
      # there is none: a check that has never failed is not known to be one.
      - name: The comparison finds the differences it should
        run: node .github/scripts/standards_status.mjs --self-test
      - name: Compare the register with the index
        run: node .github/scripts/standards_status.mjs
