# Runs a JAdES signature this workspace produced through the European
# Commission's own AdES reference implementation (DSS) and asks it what the
# signature is.
#
# Deliberately its own workflow rather than a job in `ci.yml`, for the same
# reason the AAS oracle is: it is the only check here that needs a JVM, and
# `cargo build --workspace` succeeding with zero infrastructure — no Java, no
# Maven, no services — is a property this project states publicly. Keeping the
# dependency here means the main gate never acquires it, and this job is free to
# be slow without ever being a reason to skip the fast one.
#
# What it answers: *did we build the structure ETSI TS 119 182-1 describes?*
# Every Rust test of that module checks our output against our own reading of
# the standard, and a test built from a transcription agrees with the
# transcription — including wherever the transcription is wrong. This is the one
# check that is not circular.
#
# It does **not** answer whether the signature is trusted or qualified. The
# artefact is signed under a self-signed certificate generated by the test that
# produces it, so DSS reports it untrusted, correctly. Trust needs a chain to a
# supervised trust service; qualified status needs a certificate, a creation
# device and a QTSP together. None is a property of the bytes.
name: JAdES conformance oracle

on:
  push:
    branches: ["**"]
    paths:
      - "crates/dpp-crypto/src/jades/**"
      - "crates/dpp-crypto/tests/jades_oracle_artifact.rs"
      - ".github/oracle/jades/**"
      - ".github/workflows/jades-oracle.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "crates/dpp-crypto/src/jades/**"
      - "crates/dpp-crypto/tests/jades_oracle_artifact.rs"
      - ".github/oracle/jades/**"
      - ".github/workflows/jades-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: DSS recognises the signature as JAdES-BASELINE-B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The artefact is generated rather than committed. A committed signature
      # would be validated forever regardless of what the code now produces,
      # which is the opposite of what an oracle is for.
      - name: Produce a JAdES artefact
        env:
          EMIT_JADES_ARTIFACT: "1"
        run: cargo test -p dpp-crypto --test jades_oracle_artifact -- --nocapture

      - name: Record what is actually being run
        working-directory: .github/oracle/jades
        run: mvn -q -B help:evaluate -Dexpression=dss.version -DforceStdout && echo

      - name: Build the oracle
        working-directory: .github/oracle/jades
        run: mvn -q -B package

      - name: Ask DSS what the signature is
        run: java -jar .github/oracle/jades/target/jades-oracle.jar target/jades-oracle/signature.jws

      # Kept so a failure can be read without re-running locally, and so the
      # exact bytes DSS judged are recoverable.
      - name: Upload the artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jades-artefact
          path: target/jades-oracle/
          if-no-files-found: warn
