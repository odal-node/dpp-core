name: WASM Build

# See ci.yml for why `push` is main-only and `pull_request` carries no branch
# filter (a filter excludes stacked PRs from CI entirely).
on:
  push:
    branches: [main]
  pull_request:
    # Everything the two jobs build from: the crates they compile by path (as
    # `cargo tree` lists them for each target), the workspace manifest the
    # crates take their dependencies from, the lockfile, which a dependency bump
    # changes alone (the plugins have their own, under `plugins/`), the cargo
    # config that sets the wasm32 flags, the toolchain, and this file.
    paths:
      - "crates/dpp-registry/**"
      - "crates/dpp-domain/**"
      - "crates/dpp-rules/**"
      - "crates/dpp-plugin-sdk/**"
      - "crates/dpp-plugin-traits/**"
      - "plugins/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/wasm-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  wasm-build:
    name: WASM build — dpp-registry + dpp-domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm

      - name: Build dpp-registry (wasm32)
        working-directory: crates/dpp-registry
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Build dpp-domain (wasm32)
        working-directory: crates/dpp-domain
        run: cargo build --target wasm32-unknown-unknown --release

  product-group-plugins:
    name: WASM build — product group plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain with wasm32-wasip1 target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm-plugins

      # Discovered rather than listed. The ten steps that used to stand here
      # named `plugins/sector-*` and went stale the moment the directories were
      # renamed — and because this workflow only runs against `main`/`develop`,
      # nothing on a feature branch could notice. Mirrors `just test-plugins`.
      - name: Build every plugin (wasm32-wasip1)
        run: |
          set -euo pipefail
          built=0
          for plugin in plugins/product-group-*; do
            [ -f "$plugin/Cargo.toml" ] || continue
            echo "::group::$plugin"
            (cd "$plugin" && cargo build --target wasm32-wasip1 --release)
            echo "::endgroup::"
            built=$((built + 1))
          done
          # A glob that matches nothing would leave this job green having built
          # nothing at all, which is the failure this step replaced.
          [ "$built" -gt 0 ] || { echo "ERROR: no plugins matched plugins/product-group-*"; exit 1; }
          echo "Built $built plugins."
