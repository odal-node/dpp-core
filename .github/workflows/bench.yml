name: Benchmarks

# Criterion micro-benchmarks, weekly and on demand.
#
# A measurement, not a gate. A shared runner is too noisy to fail a build on a
# timing, so this never runs on a push. What it does instead is make a regression
# visible: Criterion compares each run with the last one it saw, so the previous
# run's results are restored from a cache and the ones it judges slower are
# written to the run summary.
#
# That comparison is only as good as the two runners being alike, which is not
# guaranteed. Read a flagged bench as a reason to run it again, not as a finding.
on:
  schedule:
    - cron: "0 3 * * 1"  # Monday 03:00 UTC
  workflow_dispatch:

# Least privilege by default; see ci.yml.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    # Without a ceiling, a hang would hold a runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Criterion keeps the last run's numbers under `target/criterion` and prints
      # the change against them. That directory is saved under a key of its own,
      # and the next run restores the newest, so each run is compared with the one
      # before. The run id is in the key because a cache entry cannot be
      # overwritten.
      - name: Restore the previous run's results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/criterion
          key: criterion-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: criterion-
      - name: Run benchmarks
        # `tee` would otherwise hide a failing `cargo bench`: the step's default
        # shell has no `pipefail`.
        run: |
          set -o pipefail
          cargo bench --package dpp-benches 2>&1 | tee "$RUNNER_TEMP/bench.log"
      - name: Report the benches Criterion judges slower
        if: always()
        run: |
          {
            echo "### Benches slower than the previous run"
            echo
            echo "Indicative only: runners differ. Run a flagged bench again before believing it."
            echo
            echo '```'
            grep -B4 "Performance has regressed" "$RUNNER_TEMP/bench.log" || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Criterion reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-reports
          path: target/criterion/
          retention-days: 30
