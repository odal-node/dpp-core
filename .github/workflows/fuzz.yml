name: Fuzz (nightly)

# cargo-fuzz needs nightly + Linux + libFuzzer, so it runs on a schedule rather
# than per-commit (the stable `just check` gate does not build the fuzz crate).
on:
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC
  workflow_dispatch:

# Least privilege by default; see ci.yml.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: cargo-fuzz smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every `[[bin]]` in fuzz/Cargo.toml. `plugin_abi_envelope` existed for a
        # while without being listed here, so it never ran: a target added to the
        # manifest is added here in the same change.
        target:
          - digital_link_parse
          - plugin_abi_envelope
          - jws_verify
          - sd_jwt_parse
          - status_list_decode
          - passport_from_stored
          - identifier_parse
          - schema_validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz needs nightly, so the channel is passed and not inherited. This
      # step used to pin a commit of the action's `nightly` branch, which bakes the
      # channel into the input's default, and the SHA it named was in fact the
      # `stable` branch's commit: the job ran only because `cargo +nightly`
      # installs a toolchain it does not find. A pin that cannot be read as the
      # channel it claims is what passing the input removes.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} (60s smoke)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60 -max_len=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
