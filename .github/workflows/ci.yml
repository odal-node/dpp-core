name: CI

# One run per change, and a button for everything else.
#
# 🚨 `push: ["**"]` alongside `pull_request` ran the whole suite **twice** for
# every push to a branch with an open PR — two runners, same commit, at the same
# time. Beyond the double spend, it took two independent samples of every
# timing-sensitive gate, so a flaky-by-timing job had two chances to trip per
# push and could put a red X on a PR whose sibling run was green.
#
# `push` is now `main` only (the post-merge run) and `pull_request` is the
# pre-merge one. Exactly one fires for any given change.
#
# 🚨 `pull_request` deliberately carries **no branch filter**. The filter names
# the branch a PR is *merging into*, so `branches: [main]` silently excludes
# every **stacked** PR — one opened against another feature branch matches
# nothing. Today that is masked by `push: ["**"]` running on all branches; drop
# that trigger without also dropping the filter and stacked PRs get no CI at
# all, which is worse than the double run being fixed here.
#
# `develop` is gone: no such branch exists on this remote. It was dead config
# that read as though a second integration branch were gated.
#
# `workflow_dispatch` covers what `push: ["**"]` was really serving — running
# the full suite on a branch before opening a PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Any job needing more asks for it locally rather
# than every job inheriting a token that can write.
permissions:
  contents: read

# Cancel a superseded run rather than paying for it. A rebase or a follow-up
# push makes the in-flight run answer a question nobody is asking any more.
# `main` is excluded from cancellation: the post-merge run is the record for
# that commit, and cancelling it would leave a merged commit never fully built.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      # --all-features is load-bearing: no crate in this workspace enables
      # dpp-rules' `bundle` feature, so without it the signed-ruleset format and
      # its fail-closed verification are never built or tested in CI.
      - name: Unit tests
        run: cargo nextest run --workspace --all-features --lib
      - name: Integration tests
        run: cargo nextest run --workspace --all-features --test '*'
      - name: Assert integration count > 0
        run: |
          COUNT=$(cargo test -p dpp-tests --all-features --tests -- --list 2>&1 | grep -c ': test' || echo 0)
          printf '[A-02] dpp-tests integration tests found: %s\n' "$COUNT"
          [ "$COUNT" -gt 0 ] || { echo 'ERROR: zero integration tests — dpp-tests may be orphaned from workspace'; exit 1; }

  doc:
    name: Docs (rustdoc + doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `just check` has always run both of these and CI never did, which left a
      # locally-run command as the only thing between a broken intra-doc link and
      # a published crate. That is not hypothetical: two such links reached a
      # branch that passed every other job here, and were caught only because
      # someone ran the local gate — and one of them nearly slipped past that
      # too, because piping `just check` through `tail` reports `tail`'s exit
      # code rather than the recipe's.
      #
      # `-D warnings` is what turns this into a gate. A broken intra-doc link is
      # a warning by default, and a warning nobody reads is not a check.
      - name: cargo doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
      # Separate from the test job on purpose: `cargo nextest` does not run
      # doctests at all, which is how README examples in this workspace went a
      # long time without being compiled, several advertising functions that did
      # not exist. Each publishable crate pulls its README in via a
      # `ReadmeDoctests` item, so this compiles those too.
      - name: cargo test --doc
        run: cargo test --doc --workspace --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # 🚨 Runs before the scanners, because a lockfile they trust is only worth
      # tracking if something proves it still describes the manifests. Bump a
      # version in a `Cargo.toml` without regenerating and the scans below — and
      # the daily advisory run — keep reading the old graph, green and wrong.
      # `fuzz/Cargo.lock` was already in that state when this check was added:
      # it still pinned the workspace crates at 0.10.0.
      - name: Lockfiles match their manifests
        run: |
          for ws in . plugins fuzz; do
            (cd "$ws" && cargo metadata --locked --format-version 1 > /dev/null) || {
              echo "::error::$ws/Cargo.lock does not match $ws/Cargo.toml. Run 'just lock-regen' and commit the lockfile."
              exit 1
            }
          done
      # All three lockfiles, matching `just audit`. `plugins/` and `fuzz/` are
      # their own workspaces, so a scan of the root reads neither of them; they
      # had only the `--locked` check above, which proves a lockfile matches its
      # manifest and says nothing about advisories. Every workspace is scanned
      # before the step fails, so one run names every finding.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: |
          rc=0
          for ws in . plugins fuzz; do
            echo "::group::$ws"
            cargo audit -f "$ws/Cargo.lock" --deny yanked || rc=1
            echo "::endgroup::"
          done
          exit "$rc"
      # The three questions `cargo audit` cannot answer — licences, duplicate or
      # banned crates, and dependency provenance. Licences went unchecked here
      # until this job existed, which for a published Apache-2.0 library is the
      # gap that mattered: a consumer vendoring this crate inherits its graph's
      # obligations.
      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - name: cargo deny
        run: |
          rc=0
          for ws in . plugins fuzz; do
            echo "::group::$ws"
            cargo deny --manifest-path "$ws/Cargo.toml" check bans licenses sources || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  plugins:
    name: Product group plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
      # Plugins are excluded from the workspace, so `cargo nextest run
      # --workspace` above never reaches them. This mirrors `just
      # test-plugins` so a plugin regression fails CI, not only a local
      # `just check`.
      - name: Product group plugin tests
        run: just test-plugins
      # The same exclusion keeps them out of `cargo fmt --all` and `cargo
      # clippy --workspace`, so plugin code had no formatting check and no lint
      # at all — seven of ten crates were unformatted when this was added.
      - name: Product group plugin formatting
        run: just fmt-check-plugins
      - name: Product group plugin lint
        run: just lint-plugins
      # Each loop above asserts it did some work. This proves that assertion
      # fails on an empty match, because the failure that keeps recurring here
      # is a gate that goes green without running.
      - name: Plugin gate guards fail on an empty match
        run: just plugin-gates-self-test
